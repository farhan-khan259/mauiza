services:
  - type: web
    name: mauiza
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://mauiza-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
